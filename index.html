<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Analytics — Datacor GDS · Phase 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   DATACOR GLOBAL DESIGN SYSTEM v1.0.0 — semantic tokens, all three modes.
   Rule 1: consume semantic tokens only, never primitives, never raw hex.
   Rule 2: every fill is 100% opaque — washes use contrastHigh tokens.
   Rule 6: all spacing, radii and strokes bind to size/* variables.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --space-0:0px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
  --space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;
  --radius-none:0px;--radius-sm:4px;--radius-md:8px;--radius-lg:16px;--radius-round:1000px;
  --stroke-thin:0.5px;--stroke-regular:1px;--stroke-thick:1.5px;
  --font-family:'Noto Sans',sans-serif;
  --fs-h2:28px;--fs-h4:20px;--fs-h6:16px;--fs-body-md:16px;--fs-body-sm:14px;--fs-body-xs:12px;
  --lh-h2:1.3;--lh-h4:1.35;--lh-h6:1.45;--lh-body-sm:1.55;--lh-body-xs:1.5;
  --w-light:300;--w-regular:400;--w-medium:500;
}
[data-mode="light"]{
  --surface-base:#FFFFFF;--surface-sunken:#F5F5F5;--surface-raised1:#FFFFFF;
  --surface-accent:#122E4F;--surface-accent-hover:#1F4F87;--surface-inverse:#212121;
  --neutral-high1:#EEEEEE;--primary-main:#1976D2;--primary-high1:#BBDEFB;
  --fb-success:#C8E6C9;--fb-warning:#FFE0B2;--fb-error:#FECDD2;
  --text-primary:#212121;--text-secondary:#424242;--text-tertiary:#757575;
  --text-inverse:#FFFFFF;--text-link:#1976D2;--text-on-primary:#FFFFFF;--text-on-accent:#FFFFFF;
  --text-c-primary:#0D47A1;--text-c-success:#1B5E20;--text-c-error:#B71C1C;--text-c-warning:#BF360C;
  --border-divider:#E0E0E0;--border-light:#EEEEEE;--border-medium:#BDBDBD;--border-focus:#1976D2;
  --cat-1:#1976D2;--cat-2:#009688;--cat-3:#8E24AA;--cat-4:#C2185B;
  --ord-1:#64B5F6;--ord-2:#2196F3;--ord-3:#1976D2;--ord-4:#0D47A1;
}
[data-mode="dark"]{
  --surface-base:#212121;--surface-sunken:#0F0F0F;--surface-raised1:#424242;
  --surface-accent:#1F4F87;--surface-accent-hover:#2867B1;--surface-inverse:#FFFFFF;
  --neutral-high1:#2E2E2E;--primary-main:#1976D2;--primary-high1:#1565C0;
  --fb-success:#388E3C;--fb-warning:#F57C00;--fb-error:#E53935;
  --text-primary:#FFFFFF;--text-secondary:#EEEEEE;--text-tertiary:#BDBDBD;
  --text-inverse:#212121;--text-link:#90CAF9;--text-on-primary:#FFFFFF;--text-on-accent:#FFFFFF;
  --text-c-primary:#90CAF9;--text-c-success:#E8F5E9;--text-c-error:#FEEBEE;--text-c-warning:#FFF3E0;
  --border-divider:#616161;--border-light:#424242;--border-medium:#616161;--border-focus:#90CAF9;
  --cat-1:#1976D2;--cat-2:#009688;--cat-3:#8E24AA;--cat-4:#C2185B;
  --ord-1:#1976D2;--ord-2:#42A5F5;--ord-3:#90CAF9;--ord-4:#E3F2FD;
}
[data-mode="blue"]{
  --surface-base:#1A4372;--surface-sunken:#15365D;--surface-raised1:#1F4F87;
  --surface-accent:#122E4F;--surface-accent-hover:#1F4F87;--surface-inverse:#E3F2FD;
  --neutral-high1:#15365D;--primary-main:#42A5F5;--primary-high1:#248DE3;
  --fb-success:#388E3C;--fb-warning:#F57C00;--fb-error:#F44336;
  --text-primary:#FFFFFF;--text-secondary:#CFD8DC;--text-tertiary:#B0BEC5;
  --text-inverse:#122E4F;--text-link:#81D4FA;--text-on-primary:#122E4F;--text-on-accent:#FFFFFF;
  --text-c-primary:#90CAF9;--text-c-success:#C8E6C9;--text-c-error:#FEEBEE;--text-c-warning:#FBE9E7;
  --border-divider:#2867B1;--border-light:#1F4F87;--border-medium:#2867B1;--border-focus:#42A5F5;
  --cat-1:#1976D2;--cat-2:#009688;--cat-3:#8E24AA;--cat-4:#C2185B;
  --ord-1:#2196F3;--ord-2:#64B5F6;--ord-3:#90CAF9;--ord-4:#E3F2FD;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font-family);font-size:var(--fs-body-sm);font-weight:var(--w-regular);
 line-height:var(--lh-body-sm);color:var(--text-primary);background:var(--surface-sunken);
 -webkit-font-smoothing:antialiased}
/* ══ CORE LAYOUT: floating App Bar left, Content region right ══ */
.shell{display:flex;min-height:100vh;align-items:stretch}
.appbar-wrap{flex:0 0 85px;width:85px;padding:var(--space-4) 0 var(--space-4) var(--space-4);background:transparent}
.rail{width:69px;background:var(--surface-accent);border-radius:var(--radius-lg);
 display:flex;flex-direction:column;align-items:center;padding:var(--space-3) 0;
 position:sticky;top:var(--space-4);min-height:calc(100vh - var(--space-8))}
.rail-logo{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--primary-main);
 color:var(--text-on-primary);display:grid;place-items:center;font-weight:var(--w-medium);
 font-size:var(--fs-body-md);margin-bottom:var(--space-3)}
.rail-btn{position:relative;width:44px;height:44px;border:0;background:transparent;
 color:var(--text-on-accent);display:grid;place-items:center;cursor:pointer;
 border-radius:var(--radius-sm);margin-bottom:var(--space-1)}
.rail-btn svg{width:22px;height:22px;fill:currentColor}
.rail-btn:hover{background:var(--surface-accent-hover)}
.rail-btn:focus-visible{outline:var(--stroke-thick) solid var(--border-focus);outline-offset:2px}
.rail-btn[aria-current="true"]::before{content:"";position:absolute;left:-10px;top:9px;width:3px;
 height:26px;border-radius:var(--radius-round);background:var(--primary-main)}
.rail-div{width:32px;height:var(--stroke-thin);background:var(--border-divider);margin:var(--space-2) 0}
.rail-sp{flex:1}
.content{flex:1;min-width:0;padding-right:var(--space-4)}
/* ══ HEADER: 128px, two 40px rows, transparent ══ */
.hdr{height:128px;padding:0 var(--space-4);background:transparent}
.hdr-row{height:40px;display:flex;align-items:center;gap:var(--space-3)}
.hdr-row.r1{padding-top:var(--space-2)}
.crumbs{font-size:var(--fs-body-xs);line-height:var(--lh-body-xs);color:var(--text-tertiary)}
.crumbs b{color:var(--text-primary);font-weight:var(--w-medium)}
.crumbs span{margin:0 var(--space-1)}
.sp{flex:1}
.fld{display:flex;flex-direction:column;gap:2px}
.fld label{font-size:var(--fs-body-xs);color:var(--text-tertiary);line-height:1.2}
.hdr-title{font-size:var(--fs-h4);line-height:var(--lh-h4);font-weight:var(--w-medium)}
.hdr-title i{font-style:normal;color:var(--text-tertiary);margin:0 var(--space-2);font-weight:var(--w-light)}
.hdr-asof{font-size:var(--fs-body-xs);color:var(--text-tertiary)}
select{font-family:var(--font-family);font-size:var(--fs-body-sm);color:var(--text-primary);
 background:var(--surface-base);border:var(--stroke-regular) solid var(--border-medium);
 border-radius:var(--radius-sm);padding:var(--space-1) var(--space-2);height:32px}
select:focus-visible{outline:var(--stroke-thick) solid var(--border-focus);outline-offset:1px}
.w200{width:200px}
/* ══ TABS: indicator 1.5px, 24px gap to content ══ */
.tabs{display:flex;border-bottom:var(--stroke-regular) solid var(--border-divider);margin:0 var(--space-4);
 overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:transparent;cursor:pointer;font-family:var(--font-family);
 font-size:var(--fs-body-md);line-height:var(--lh-h6);color:var(--text-secondary);
 padding:var(--space-2) var(--space-4);border-bottom:var(--stroke-thick) solid transparent;
 margin-bottom:calc(-1 * var(--stroke-regular));flex:0 0 auto;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--text-c-primary);border-bottom-color:var(--primary-main);
 font-weight:var(--w-medium)}
main{padding:var(--space-6) var(--space-4) var(--space-12)}
/* ══ CARDS ══ */
.grid{display:grid;gap:var(--space-4);margin-bottom:var(--space-4)}
.kpi{background:var(--surface-raised1);border:var(--stroke-regular) solid var(--border-light);
 border-radius:var(--radius-md);padding:var(--space-4);min-width:0;display:flex;gap:var(--space-3)}
.kpi-body{min-width:0;flex:1}
.kpi-badge{width:36px;height:36px;border-radius:var(--radius-md);flex:0 0 auto;display:grid;place-items:center}
.kpi-badge svg{width:19px;height:19px}
.kpi-l{font-size:var(--fs-body-xs);line-height:var(--lh-body-xs);color:var(--text-tertiary)}
.kpi-v{font-size:var(--fs-h2);line-height:var(--lh-h2);font-weight:var(--w-medium);
 font-variant-numeric:tabular-nums;margin:var(--space-1) 0 0}
.kpi-c{font-size:var(--fs-body-xs);display:flex;align-items:center;gap:var(--space-1);
 font-variant-numeric:tabular-nums;flex-wrap:wrap}
.kpi-c.up{color:var(--text-c-success)}.kpi-c.dn{color:var(--text-c-error)}.kpi-c.fl{color:var(--text-tertiary)}
.kpi-s{font-size:var(--fs-body-xs);color:var(--text-tertiary);margin-top:2px}
.prog{height:var(--space-1);background:var(--primary-high1);border-radius:var(--radius-round);
 overflow:hidden;margin-top:var(--space-2)}
.prog i{display:block;height:100%;background:var(--primary-main);border-radius:var(--radius-round)}
.card{background:var(--surface-base);border-radius:var(--radius-lg);
 border:var(--stroke-regular) solid var(--border-light);min-width:0;overflow:hidden;margin-bottom:var(--space-4)}
.grid .card{margin-bottom:0}
.card-hd{padding:var(--space-4) var(--space-4) var(--space-2);display:flex;align-items:baseline;
 gap:var(--space-2);flex-wrap:wrap}
.card-t{font-size:var(--fs-body-sm);font-weight:var(--w-medium)}
.card-s{font-size:var(--fs-body-xs);color:var(--text-tertiary)}
.card-bd{padding:0 var(--space-4) var(--space-4)}
.card-toolbar{display:flex;align-items:flex-end;gap:var(--space-3);flex-wrap:wrap;
 padding:var(--space-3) var(--space-4);border-bottom:var(--stroke-thin) solid var(--border-divider)}
.card-foot{padding:var(--space-2) var(--space-4);font-size:var(--fs-body-xs);color:var(--text-secondary);
 border-top:var(--stroke-thin) solid var(--border-divider)}
.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;padding:0 var(--space-4) var(--space-2);
 font-size:var(--fs-body-xs);color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:var(--space-1)}
.sw{width:10px;height:10px;flex:0 0 auto;border-radius:2px}
.swl{width:14px;height:var(--stroke-thick);border-radius:0}
/* ══ CHIPS: radius/round, small 24px, default neutral/contrastHigh1 ══ */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 var(--space-2);
 border-radius:var(--radius-round);font-size:var(--fs-body-xs);font-weight:var(--w-medium);
 background:var(--neutral-high1);color:var(--text-secondary);white-space:nowrap}
.chip.ok{background:var(--fb-success);color:var(--text-c-success)}
.chip.warn{background:var(--fb-warning);color:var(--text-c-warning)}
.chip.err{background:var(--fb-error);color:var(--text-c-error)}
.chip.pri{background:var(--primary-main);color:var(--text-on-primary)}
button.chip{border:0;cursor:pointer;font-family:var(--font-family)}
button.chip:focus-visible{outline:var(--stroke-thick) solid var(--border-focus);outline-offset:1px}

/* ══ TABLE: grey header, striped rows, pagination inside the card ══ */
table{width:100%;border-collapse:collapse;font-size:var(--fs-body-xs)}
th{text-align:left;font-weight:var(--w-medium);color:var(--text-secondary);background:var(--neutral-high1);
 padding:var(--space-2);border-bottom:var(--stroke-regular) solid var(--border-divider);white-space:nowrap}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
th.sorted{color:var(--text-primary)}
td{padding:var(--space-2);border-bottom:var(--stroke-thin) solid var(--border-divider)}
tbody tr:nth-child(even) td{background:var(--neutral-high1)}
tbody tr.clk{cursor:pointer}
tbody tr.clk td:first-child{color:var(--text-link)}
tbody tr.clk:hover td{background:var(--primary-high1)}
tbody tr.tot td{background:var(--neutral-high1);font-weight:var(--w-medium);
 border-top:var(--stroke-regular) solid var(--border-medium)}
.tw{overflow-x:auto}
/* ══ TOOLTIP: surface/inverse, 12px, radius/sm, 4px 8px, arrow required ══ */
#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;
 background:var(--surface-inverse);color:var(--text-inverse);font-size:var(--fs-body-xs);
 line-height:var(--lh-body-xs);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);
 max-width:300px;z-index:99;font-variant-numeric:tabular-nums}
#tip::after{content:"";position:absolute;left:var(--space-3);bottom:-5px;
 border-left:5px solid transparent;border-right:5px solid transparent;
 border-top:5px solid var(--surface-inverse)}
#tip.below::after{bottom:auto;top:-5px;border-top:0;border-bottom:5px solid var(--surface-inverse)}
svg.chart{display:block;overflow:visible}
.note{font-size:var(--fs-body-xs);color:var(--text-tertiary);padding:0 var(--space-4)}

/* ══ ADDED: patterns harvested from a production Datacor-customer analytics suite ══ */
.gauto{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
.mini{display:flex;gap:var(--space-4);flex-wrap:wrap;padding:0 var(--space-4) var(--space-3);
 font-size:var(--fs-body-xs);color:var(--text-secondary)}
.mini b{font-weight:var(--w-medium);color:var(--text-primary);font-variant-numeric:tabular-nums}
.rule{font-size:var(--fs-body-xs);color:var(--text-tertiary);padding:0 var(--space-4) var(--space-3)}
.cslot{padding:var(--space-1) var(--space-4) var(--space-4);overflow-x:auto;min-width:0}
/* ══ FIVE GDS BREAKPOINTS: xs 0 · sm 600 · md 900 · lg 1200 · xl 1536 ══ */
.g4,.g3,.g2,.g1{grid-template-columns:1fr}
@media (min-width:600px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
 .g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1200px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:899px){.appbar-wrap{flex-basis:69px;width:69px;padding-left:var(--space-2)}
 .rail{width:53px}.rail-btn{width:38px;height:38px}
 .hdr{height:auto;padding-bottom:var(--space-2)}
 .hdr-row{height:auto;flex-wrap:wrap;padding:var(--space-1) 0}.w200{width:100%;min-width:150px}}
</style>
</head>
<body>
<div class="shell">
  <div class="appbar-wrap"><nav class="rail" id="rail" aria-label="Primary navigation"></nav></div>
  <div class="content">
    <div class="hdr">
      <div class="hdr-row r1">
        <div class="crumbs" id="crumbs"></div><div class="sp"></div>
        <div class="fld"><label for="fCo">Company</label><select id="fCo" class="w200"></select></div>
        <div class="fld"><label for="fCcy">Currency</label><select id="fCcy" class="w200"></select></div>
      </div>
      <div class="hdr-row">
        <div class="hdr-title" id="title"></div><div class="sp"></div>
        <div class="hdr-asof" id="asof"></div>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <main id="view"></main>
  </div>
</div>
<div id="tip" role="status" aria-live="polite"></div><script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   PATTERNS BORROWED FROM A PRODUCTION DATACOR-CUSTOMER ANALYTICS SUITE
   ───────────────────────────────────────────────────────────────────────────
   Five mechanics observed working in the field are wired in here:

   1. A PERIOD parameter (Day · WTD · MTD · QTD · HTD · YTD · R1M · R3M · R6M
      · R12M) that re-scopes every measure on the sheet. Not one visual per
      period — one visual, one measure definition, one parameter.
   2. A COMPARISON parameter (vs. last year / vs. prior period of equal length).
   3. WORKING-DAY pacing — # working days, worked, remaining — because
      attainment paces on selling days, not calendar days.
   4. A MEASURE parameter, so one page answers ten questions.
   5. RFM + ABC + trend BANDING as configurable rules, which is what actually
      produces the customer-count metrics (acquired / active / loyal / repeat /
      high volume / at risk / lost).

   Also adopted from that suite's data model: sales split into PRODUCT SALES
   (invoice line) and OTHER SALES (miscellaneous charges, which sit on the
   invoice HEADER), giving two distinct gross-margin definitions; order-level
   CUSTOMER OTIF; and ASP / ATV.

   All of it requires a day-grain fact table, so the fact layer below is
   invoice-line-with-a-real-date rather than a monthly bucket.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ─── 1. CALENDAR ─────────────────────────────────────────────────────────
   Day 0 = 1 Jan 2024, so every window — including a rolling-12-month window
   compared with the same window a year earlier — has real history behind it. */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WDN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY0=Date.UTC(2024,0,1), MS=86400000;
const dt=d=>new Date(DAY0+d*MS);
const di=(y,m,dd)=>Math.round((Date.UTC(y,m,dd)-DAY0)/MS);
const dim=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
const mi=d=>{const x=dt(d);return (x.getUTCFullYear()-2024)*12+x.getUTCMonth();};
const mLbl=i=>MON[i%12]+" '"+String(2024+Math.floor(i/12)).slice(2);
const isWD=d=>{const w=dt(d).getUTCDay();return w>0&&w<6;};
const sow=d=>d-((dt(d).getUTCDay()+6)%7);          /* ISO week starts Monday */
const fmtDay=d=>{const x=dt(d);
  return WDN[x.getUTCDay()]+" "+x.getUTCDate()+" "+MON[x.getUTCMonth()]+" "+x.getUTCFullYear();};
const TODAY=di(2026,7,19);                          /* Wed 19 Aug 2026 */

/* ─── 2. DATA MODEL ───────────────────────────────────────────────────────
   Built upward from product-class economics so every total reconciles by
   construction: product sales == sum(sellers) == sum(customers) == sum(classes).
   Revenue = kg x price. Cost = revenue x (1 - grossMargin%).
   Rebate = revenue x rebate%.
   Other sales are header charges and are deliberately NOT allocated to a
   product class — that is why the class roll-up reconciles to product sales
   and not to total sales. ─────────────────────────────────────────────── */
/* name, $/kg, gross margin %, supplier rebate % of revenue */
const CLS=[
 ["Minerals",4.20,11.5,1.2],["Nutritional Supplements",9.80,14.0,0.9],
 ["Excipients",3.10,18.5,0.4],["Carotenoids",62.00,22.0,2.1],
 ["Vitamins",24.50,16.5,1.5],["Fibers",5.40,13.0,0.6],
 ["Sweeteners",7.90,12.0,0.8],["Acidulants",2.60,15.5,0.3],
 ["Flavors",38.00,26.0,1.8],["OTC Pharma",54.00,24.5,2.4],
 ["Premixes",16.20,19.0,1.1],["Phosphates",3.80,14.5,0.5],
 ["Aminos",28.00,21.0,1.6],["Industrial",1.90,9.5,0.2]];
const CLSN=CLS.map(c=>c[0]);
/* Maintained margin target — the ERP Customer Product / Price Book Margin %. */
const CLS_TGT=CLS.map(c=>c[2]-1.0);

const REPS=[
 {id:"r1",n:"A. Okonkwo",  team:"East",   co:"us",att:0.86},
 {id:"r2",n:"M. Delgado",  team:"East",   co:"us",att:1.05},
 {id:"r3",n:"S. Whitfield",team:"East",   co:"us",att:0.77},
 {id:"r4",n:"J. Bergstrom",team:"West",   co:"us",att:1.04},
 {id:"r5",n:"P. Raghavan", team:"West",   co:"us",att:0.95},
 {id:"r6",n:"C. Lindqvist",team:"West",   co:"us",att:0.69},
 {id:"r7",n:"T. Abramson", team:"Key",    co:"us",att:0.99},
 {id:"r8",n:"N. Farrukh",  team:"Key",    co:"us",att:1.03},
 {id:"k1",n:"H. Tremblay", team:"Central",co:"ca",att:1.04},
 {id:"k2",n:"D. Beauchamp",team:"Central",co:"ca",att:0.79},
 {id:"k3",n:"R. Ferland",  team:"West",   co:"ca",att:1.05},
 {id:"k4",n:"L. Gagnon",   team:"Quebec", co:"ca",att:0.92},
 {id:"k5",n:"M. Chevalier",team:"East",   co:"ca",att:1.07},
 {id:"k6",n:"S. Thibault", team:"West",   co:"ca",att:0.74},
 {id:"k7",n:"A. Rousseau", team:"Quebec", co:"ca",att:0.98}];

/* id, name, rep, customer category, cadence seed, annual kg, class count,
   first class index, credit limit, days-to-pay now, days-to-pay prior,

   Late starts and early stops are what make the acquired / at-risk / lost

const CATS=["National","Regional","Local"];

/* deterministic pseudo-random, so figures never move between reloads */
const rnd=(a,b)=>{let x=(a*73856093)^(b*19349663);x=(x^(x>>>13))*1274126177;return ((x>>>0)%10000)/10000;};
const SEAS=[0.94,0.97,1.06,1.04,1.02,0.99,0.91,0.96,1.05,1.08,1.03,0.95];  /* by calendar month */
const grow=m=>1+m*0.0042;

/* ── 2a. Invoice lines, on real dates ──
   A customer x product class is ordered on a cadence, not every month. That
   cadence is what the ERP Customer Product reorder fields describe, and it is
   what makes recency, days-since-order and the reorder-decay flag real rather
   than asserted. */
const CUST=[], CMAP={}, LINES=[];
CUS.forEach((c,ci)=>{
  const [id,n,rep,cat,seed,kgScale,nc,off,lim,dtp,dtpP,fm,tm]=c;
  const cust={id,n,rep,cat,seed,lim,dtp,dtpP,
    co:(REPS.find(r=>r.id===rep)||{}).co,classes:[],
    othR:0.011+rnd(ci,301)*0.026,          /* freight, tariff and handling as % of product sales */
    lateP:0.018+rnd(ci,302)*0.075, shortP:0.008+rnd(ci,303)*0.035};
  const d0=di(2024,0,1)+Math.round((fm/12)*365), d1=Math.min(TODAY,di(2024,0,1)+Math.round(((tm+1)/12)*365)-1);
  cust.from=d0; cust.to=d1;
  let wsum=0; const w=[];
  for(let j=0;j<nc;j++){const x=0.35+rnd(ci,j)*1.4;w.push(x);wsum+=x;}
  for(let j=0;j<nc;j++){
    const cIdx=(off+j*3+(ci%2))%CLS.length;
    if(cust.classes.some(x=>x.ci===cIdx))continue;
    const annKg=kgScale*(w[j]/wsum);
    /* orders per year for this class: 2 to 14, the ERP Order Frequency field */
    const perYear=Math.max(6,Math.round(8+rnd(ci,j+50)*22));
    const iv=Math.round(365/perYear);
    /* Contract price is negotiated at customer x product and does not erode.
       The invoiced price wobbles around it and drifts below over time — that
       gap is PRICE LEAKAGE, a different mechanism from margin erosion, and the
       reason cost must be anchored to the contract price rather than to
       whatever was actually charged. */
    const cPrice=CLS[cIdx][1]*(0.92+rnd(ci,cIdx)*0.16);
    /* realised-to-contract discipline for this customer x class: 0.955 to
       1.030, so the book contains genuine leakage, genuine adherence, and a
       little spot premium rather than one uniform drift */
    const pFac=0.958+rnd(ci,cIdx+700)*0.079;
    const cl={ci:cIdx,annKg,perYear,ivNom:iv,cPrice,days:[]};
    /* an erratic account stretches its interval late in life, which is how a
       decaying account actually looks before it stops */
    const drift=seed==="erratic"?1:seed==="normal"?1:1;
    let k=0;
    for(let d=d0+Math.round(rnd(ci,j+70)*iv); d<=d1; ){
      const m=mi(d);
      const kg=annKg/perYear*SEAS[m%12]*grow(m)*(0.80+rnd(ci*37+j,k)*0.40);
      const price=cPrice*pFac*(1+(rnd(ci*29+j,k+400)-0.5)*0.028-m*0.0004);
      const rev=kg*price, cRev=kg*cPrice;
      LINES.push({cust:id,rep,co:cust.co,cat,ci:cIdx,d,m,kg,rev,cRev,
        cost:cRev*(1-CLS[cIdx][2]/100), reb:rev*CLS[cIdx][3]/100});
      cl.days.push(d);
      const stretch=seed==="erratic"?(1+Math.max(0,(d-d0)/(d1-d0||1))*0.55):1;
      d+=Math.max(6,Math.round(iv*drift*stretch*(0.78+rnd(ci*41+j,k)*0.46)));
      k++;
    }
    if(cl.days.length){cust.classes.push(cl);}
  }
  cust.classes.forEach(cl=>{
    cl.firstDay=cl.days[0]; cl.lastDay=cl.days[cl.days.length-1];
    cl.interval=cl.days.length>1?Math.round((cl.lastDay-cl.firstDay)/(cl.days.length-1)):cl.ivNom;
  });
  CUST.push(cust); CMAP[id]=cust;
});

/* ── 2b. Invoice headers ──
   Lines invoiced on the same day for the same customer form one invoice.
   Miscellaneous charges live HERE, on the header, not on the line — which is
   exactly why "gross margin % (product)" and "gross margin % (product + other
   sales)" are two different numbers. */
const INV=[]; {
  const k={};
  LINES.forEach(l=>{const key=l.cust+"|"+l.d; let v=k[key];
    if(!v){v=k[key]={cust:l.cust,rep:l.rep,co:l.co,cat:l.cat,d:l.d,m:l.m,
      rev:0,cRev:0,kg:0,cost:0,reb:0,lines:0};k[key]=v;INV.push(v);}
    v.rev+=l.rev;v.cRev+=l.cRev;v.kg+=l.kg;v.cost+=l.cost;v.reb+=l.reb;v.lines++;});
  INV.sort((a,b)=>a.cust<b.cust?-1:a.cust>b.cust?1:a.d-b.d);
  let oid=0,prev=null;
  INV.forEach((v,i)=>{
    const c=CMAP[v.cust];
    v.oth=v.rev*c.othR; v.othCost=v.oth*0.86;      /* accessorials carry thin margin */
    v.late=rnd(i,401)<c.lateP; v.short=rnd(i,402)<c.shortP;
    v.otif=!v.late&&!v.short;
    /* a shipment released in two tranches is one order, two invoices */
    if(prev&&prev.cust===v.cust&&v.d-prev.d<=6&&rnd(i,403)<0.30)v.ord=prev.ord; else v.ord=++oid;
    prev=v;});
}

/* ── 2b-ii. Credit limits ──
   A limit only means something relative to the balance the account actually
   runs, so derive it from trailing-365 sales at the customer's own days-to-pay
   and vary the headroom factor. Hardcoded limits drift out of scale the moment
   the revenue model changes. */
CUST.forEach((c,ci)=>{
  const t=INV.reduce((s,v)=>v.cust===c.id&&v.d>TODAY-365&&v.d<=TODAY?s+v.rev+v.oth:s,0);
  const bal=t/365*c.dtp;
  c.lim=Math.max(100000,Math.round(bal*(0.84+rnd(ci,501)*1.55)/50000)*50000);
});

/* ── 2c. Open order book, point in time ──
   An order is open between the day it is placed and the day it ships, so the
   book is correct at any as-of date rather than only at "today". */
const OPEN=[];
CUST.forEach((c,ci)=>c.classes.forEach((cl,j)=>{
  for(let d=c.from+Math.round(rnd(ci,j+120)*40); d<=TODAY+40; d+=24+Math.round(rnd(ci*53+j,d%97)*46)){
    const kg=cl.annKg/9*(0.55+rnd(ci*59+j,d%89)*0.9);
    const price=CLS[cl.ci][1]*(0.94+rnd(ci,cl.ci)*0.13);
    /* a blanket order is scheduled out much further than a discrete one, which
       is why the two must stay separable — pooling them distorts the age
       profile as well as the value of the book */
    const bl=rnd(ci*17+j,d%79)<0.38;
    const lead=bl?34+Math.round(rnd(ci*61+j,d%83)*146):7+Math.round(rnd(ci*67+j,d%83)*46);
    OPEN.push({cust:c.id,rep:c.rep,co:c.co,cat:c.cat,ci:cl.ci,kg,rev:kg*price,
      orderDay:d, shipDay:d+lead, blanket:bl});
  }
}));

/* ── 2d. CRM pipeline and quotes, point in time ──
   In the DW mapping a CRM opportunity IS the quote header, so both live on the
   same object and are read at two grains: an opportunity has a stage and an
   expected close; a quote has a decision date and an outcome. */
const STAGE=["Qualified","Sampling","Trial order","Contract","Committed"];
const PIPE=[],QUOTE=[];
REPS.forEach((r,ri)=>{
  /* An opportunity and a quote both belong to an account and name a product
     class, because the DW model makes the CRM opportunity the quote header and
     Opportunity Product the quote line. Without the account link there is no
     win/loss by segment, and without the product there is none by product. */
  const book=CUST.filter(c=>c.rep===r.id);
  if(!book.length)return;
  const pick=(i,salt)=>{const c=book[Math.floor(rnd(ri*7+salt,i)*book.length)%book.length];
    const cl=c.classes[Math.floor(rnd(ri*11+salt,i)*c.classes.length)%c.classes.length];
    return [c,cl?cl.ci:0];};
  for(let i=0;i<30;i++){
    const createDay=Math.round(rnd(ri,i)*(TODAY+20));
    const life=70+Math.round(rnd(ri,i+30)*300);
    const [c,ci]=pick(i,1);
    PIPE.push({rep:r.id,co:r.co,cust:c.id,cat:c.cat,ci,amt:180000+rnd(ri,i+90)*2400000,
      createDay,closeDay:createDay+life,life,tgt:Math.floor(rnd(ri,i+60)*5)});
  }
  for(let i=0;i<46;i++){
    const createDay=Math.round(rnd(ri,i+200)*(TODAY+10));
    const [c,ci]=pick(i,2);
    QUOTE.push({rep:r.id,co:r.co,cust:c.id,cat:c.cat,ci,amt:40000+rnd(ri,i+230)*640000,createDay,
      decideDay:createDay+16+Math.round(rnd(ri,i+260)*100),
      won:rnd(ri,i+290)<(0.20+r.att*0.16)});
  }
});

/* ─── 3. PERIOD, COMPARISON AND AS-OF ─────────────────────────────────────
   Three separate parameters, deliberately. The as-of date anchors the view;
   the period decides how far back from that anchor every measure reaches; the
   comparison decides what it is measured against. ─────────────────────────*/
const RELDATE=[
 ["today","Today"],["yesterday","Yesterday"],["lastworkday","Last workday"],
 ["lastweek","Last week"],["lastmonth","Last month"],["lastquarter","Last quarter"],
 ["lasthalf","Last half"],["lastyear","Last year"]];
function anchorOf(k){
  const x=dt(TODAY), y=x.getUTCFullYear(), m=x.getUTCMonth();
  switch(k){
    case "yesterday":  return TODAY-1;
    case "lastworkday":{let d=TODAY-1;while(!isWD(d))d--;return d;}
    case "lastweek":   return sow(TODAY)-1;
    case "lastmonth":  return di(y,m,1)-1;
    case "lastquarter":return di(y,Math.floor(m/3)*3,1)-1;
    case "lasthalf":   return di(y,m<6?0:6,1)-1;
    case "lastyear":   return di(y,0,1)-1;
    default:           return TODAY;
  }
}
/* value, short badge, and the label the Dropdown control shows. HTD has no
   native QuickSight granularity (TimeGranularity stops at QUARTER) and is
   therefore period arithmetic in a calculated field, not a relative-date
   control — same for every rolling option. */
const PERIODS=[["day","Day","Day"],["wtd","WTD","Week to date (WTD)"],
 ["mtd","MTD","Month to date (MTD)"],["qtd","QTD","Quarter to date (QTD)"],
 ["htd","HTD","Half to date (HTD)"],["ytd","YTD","Year to date (YTD)"],
 ["r1m","R1M","Rolling 1 month (R1M)"],["r3m","R3M","Rolling 3 months (R3M)"],
 ["r6m","R6M","Rolling 6 months (R6M)"],["r12m","R12M","Rolling 12 months (R12M)"]];
const PLABEL={day:"the day",wtd:"week to date",mtd:"month to date",qtd:"quarter to date",
 htd:"half to date",ytd:"year to date",r1m:"rolling 1 month",r3m:"rolling 3 months",
 r6m:"rolling 6 months",r12m:"rolling 12 months"};
const TODATE=["day","wtd","mtd","qtd","htd","ytd"];
const isToDate=p=>TODATE.indexOf(p)>=0;
function backMonths(b,n){
  const x=dt(b), y=x.getUTCFullYear(), m=x.getUTCMonth(), dd=x.getUTCDate();
  const ty=y+Math.floor((m-n)/12), tm=((m-n)%12+12)%12;
  return di(ty,tm,Math.min(dd,dim(ty,tm)))+1;
}
function win(p,b){
  const x=dt(b), y=x.getUTCFullYear(), m=x.getUTCMonth();
  switch(p){
    case "day": return [b,b];
    case "wtd": return [sow(b),b];
    case "mtd": return [di(y,m,1),b];
    case "qtd": return [di(y,Math.floor(m/3)*3,1),b];
    case "htd": return [di(y,m<6?0:6,1),b];
    case "ytd": return [di(y,0,1),b];
    case "r1m": return [backMonths(b,1),b];
    case "r3m": return [backMonths(b,3),b];
    case "r6m": return [backMonths(b,6),b];
    default:    return [backMonths(b,12),b];
  }
}
function pEnd(p,b){
  const x=dt(b), y=x.getUTCFullYear(), m=x.getUTCMonth();
  switch(p){
    case "day": return b;
    case "wtd": return sow(b)+6;
    case "mtd": return di(y,m,dim(y,m));
    case "qtd":{const q=Math.floor(m/3)*3+2;return di(y,q,dim(y,q));}
    case "htd":{const hh=m<6?5:11;return di(y,hh,dim(y,hh));}
    case "ytd": return di(y,11,31);
    default:    return b;
  }
}
const CMPS=[["ly","vs. last year"],["lp","vs. prior period"]];
function cmpWin(p,b,mode){
  if(mode==="ly"){
    const x=dt(b), y=x.getUTCFullYear()-1, m=x.getUTCMonth();
    return win(p,di(y,m,Math.min(x.getUTCDate(),dim(y,m))));
  }
  const [a,z]=win(p,b), len=z-a+1;
  return [a-len,a-1];
}
/* Plan density: seasonal, per day, normalised so a full calendar year sums to
   exactly one annual quota. That makes plan work for any window — to-date or
   rolling — without a second plan table. */
const SEASN=SEAS.reduce((a,b)=>a+b,0)/12;
const planDay=d=>{const x=dt(d);
  return SEAS[x.getUTCMonth()]/(12*dim(x.getUTCFullYear(),x.getUTCMonth()))/SEASN;};
const planWin=(a,b)=>{let s=0;for(let d=a;d<=b;d++)s+=planDay(d);return s;};
const wdCount=(a,b)=>{let n=0;for(let d=a;d<=b;d++)if(isWD(d))n++;return n;};

/* quota, set so year-to-date attainment at today lands on the intended spread */
{const a=di(2026,0,1), share=planWin(a,TODAY);
 REPS.forEach(r=>{
   const s=new Set(CUST.filter(c=>c.rep===r.id).map(c=>c.id));
   const rev=INV.reduce((t,v)=>s.has(v.cust)&&v.d>=a&&v.d<=TODAY?t+v.rev+v.oth:t,0);
   r.quota=rev/(r.att*share||1);});}

/* ─── 4. MEASURES ─────────────────────────────────────────────────────────
   One bundle per window. Every KPI on every sheet reads from a bundle, so a
   change of period or comparison moves everything at once. ────────────────*/
function bundle(invs,a,b){
  let rev=0,cRev=0,oth=0,cost=0,othCost=0,reb=0,kg=0,tx=0,lines=0;
  const ord={},cus={};
  for(let i=0;i<invs.length;i++){const v=invs[i];
    if(v.d<a||v.d>b)continue;
    rev+=v.rev;cRev+=v.cRev;oth+=v.oth;cost+=v.cost;othCost+=v.othCost;reb+=v.reb;kg+=v.kg;
    tx++;lines+=v.lines;cus[v.cust]=1;
    const o=ord[v.ord]; if(o===undefined)ord[v.ord]=v.otif; else ord[v.ord]=o&&v.otif;}
  const keys=Object.keys(ord); let ok=0;
  keys.forEach(k=>{if(ord[k])ok++;});
  const tot=rev+oth;
  return {rev,cRev,oth,cost,othCost,reb,kg,tx,lines,tot,orders:keys.length,
    leak:cRev-rev, priceIdx:cRev?rev/cRev*100:0, cAsp:kg?cRev/kg:0,
    mgnP:rev?(rev-cost+reb)/rev*100:0,
    mgnPg:rev?(rev-cost)/rev*100:0,
    mgnT:tot?(tot-cost-othCost+reb)/tot*100:0,
    mgn$:rev-cost+reb,
    asp:kg?rev/kg:0, atv:tx?tot/tx:0,
    otif:keys.length?ok/keys.length*100:0,
    cust:Object.keys(cus).length};
}
/* the measure parameter */
const MEAS=[
 ["sales","Sales",         b=>b.tot,  M,   "Product plus other sales"],
 ["prod","Product sales",  b=>b.rev,  M,   "Invoice line only"],
 ["qty","Sales qty",       b=>b.kg,   KG,  "Mass, converted to kg"],
 ["gm","GM % (product)",   b=>b.mgnP, v=>P(v), "Net of supplier rebate"],
 ["gmt","GM % (prod+other)",b=>b.mgnT,v=>P(v), "Includes header charges"],
 ["tx","# Transactions",   b=>b.tx,   N,   "Invoice count"],
 ["cust","# Customers",    b=>b.cust, N,   "Distinct customers invoiced"],
 ["asp","ASP per kg",      b=>b.asp,  PKG, "Product sales / volume"],
 ["atv","ATV",             b=>b.atv,  M,   "Total sales / transaction"],

 ["pidx","Price vs contract",b=>b.priceIdx,v=>P(v,1),"Invoiced price as % of contract price"],
 ["leak","Price leakage",   b=>b.leak,  M,   "Contract value not invoiced"]];

/* ─── 5. BANDING RULES ────────────────────────────────────────────────────
   Recency, frequency, monetary, ABC, relationship length and trend, each a
   source column banded into a target column. Thresholds are shown on the

  opts.forEach(([v,x])=>{const o=document.createElement("option");o.value=v;o.textContent=x;

function toolbar(){
  /* Five parameters, five GDS Select controls. QuickSight offers exactly eight
     parameter-control display types — Text field, Text field multiline,
     Dropdown, Dropdown multiselect, List, List multiselect, Slider,
     Date-picker — and NO button-group, segmented or tab-style control. The
     button rows used by the production suite this borrows from therefore
     cannot be reproduced; a single-select Dropdown is the native substitute,
     and it is also the one input whose GDS Select styling is already in use in
     the Header. Controls are free-form placeable and can be pinned to the top
     of a sheet, so a horizontal row of them is legitimate. */
  const c=h("div","card"),t=h("div","card-toolbar");
  t.appendChild(fld("As-of date",sel("fDate",RELDATE,S.asof,v=>{S.asof=v;draw();}),1.6));
  t.appendChild(fld("Period",sel("fPer",PERIODS.map(p=>[p[0],p[2]]),S.period,v=>{S.period=v;draw();}),2.1));
  t.appendChild(fld("Comparison",sel("fCmp",CMPS,S.cmp,v=>{S.cmp=v;draw();}),1.6));
  t.appendChild(fld("Salesperson",sel("fRep",[["all","All salespeople"]].concat(repList().map(r=>[r.id,r.n])),S.rep,v=>{S.rep=v;draw();}),1.6));

  t.appendChild(fld("Order type",sel("fSo",[["all","All order types"],["order","Discrete orders only"],["blanket","Blanket orders only"]],S.so,v=>{S.so=v;draw();}),1.6));
  c.appendChild(t);
  /* The window summary is a custom-narrative Insight visual: its expression
     editor can insert parameters, computations, functions and inline IF, so
     the active-parameter state belongs here rather than in a chip row, which
     QuickSight has no equivalent for. */
  const parts=[
    `Window <b>${fmtDay(G.a)}</b> to <b>${fmtDay(G.z)}</b> · ${PLABEL[S.period]}`,
    `Compared with <b>${G.cmpOK?fmtDay(G.ca)+" to "+fmtDay(G.cz):"— no comparable history"}</b>`];

  if(scope.length)parts.push("Scoped to <b>"+scope.join(", ")+"</b>");
  c.appendChild(h("div","mini",parts.map(p=>"<span>"+p+"</span>").join("")));
  return c;
}

    const r3=row("g4");

  }

  /* ── Growth: one measure parameter, contribution to change ── */
  if(tab===1){
    const m=measOf(S.meas), f=m[2], fm=m[3];

    v.appendChild(h("div","note",m[1]+" — "+m[4]+

    const cur=f(g.cur), prv=g.prv?f(g.prv):null;
    const r1=row("g3");
    r1.appendChild(KPI({label:m[1]+" — "+PLABEL[S.period],value:fm(cur)}));
    r1.appendChild(KPI({label:m[1]+" — comparison window",value:prv==null?"—":fm(prv),
      sub:g.cmpOK?fmtDay(g.ca)+" to "+fmtDay(g.cz):"no comparable history"}));
    r1.appendChild(KPI({label:"Change",value:prv==null?"—":(cur-prv>=0?"+":"−")+fm(Math.abs(cur-prv)),
      cmp:prv==null?"n/a":(prv?SP((cur/prv-1)*100)+"%":"n/a"),dir:prv==null?0:cur>=prv?1:-1,cmpL:CMPLBL()}));
    v.appendChild(r1);

    const deltas=g.reps.map(r=>({n:r.n,cur:f(r.cur),prv:r.prv?f(r.prv):null}))
      .map(x=>({...x,ch:x.prv==null?null:x.cur-x.prv}));
    if(ADDITIVE.indexOf(S.meas)>=0&&g.cmpOK){
      const up=deltas.filter(x=>x.ch>0).sort((a,b)=>b.ch-a.ch);
      const dn=deltas.filter(x=>x.ch<0).sort((a,b)=>a.ch-b.ch);
      const r2=row("g2");
      const cu=card("Favourable movement by seller",fm(up.reduce((s,x)=>s+x.ch,0))+" gained");
      cu.appendChild(waterfall(up.map(x=>[x.n,x.ch]),{fmt:fm,empty:"No seller improved on this measure."}));
      const cd=card("Unfavourable movement by seller",fm(Math.abs(dn.reduce((s,x)=>s+x.ch,0)))+" lost");
      cd.appendChild(waterfall(dn.map(x=>[x.n,x.ch]),{fmt:fm,empty:"No seller declined on this measure."}));
      r2.appendChild(cu);r2.appendChild(cd);v.appendChild(r2);
    }else{
      const r2=row("g1");
      const cb=card(m[1]+" by seller");
      cb.appendChild(barH(deltas.slice().sort((a,b)=>b.cur-a.cur).map(x=>[x.n,x.cur,
        x.ch==null?"no comparison":"change "+(x.ch>=0?"+":"−")+fm(Math.abs(x.ch))]),{fmt:fm,lw:130}));
      r2.appendChild(cb);v.appendChild(r2);
    }
    const r3=row("g1");
    const ct=card("Seller ranking",m[1]+" · "+PLABEL[S.period]+" "+CMPLBL());
    ct.appendChild(tbl(["Seller",{t:m[1],n:1},{t:"Comparison",n:1},{t:"Change",n:1},{t:"Change %",n:1}],
      deltas.slice().sort((a,b)=>(b.ch==null?-1e18:b.ch)-(a.ch==null?-1e18:a.ch)).map(x=>({c:[x.n,fm(x.cur),
        x.prv==null?"—":fm(x.prv),
        {html:x.ch==null?"—":chip(x.ch>=0?"ok":"err",(x.ch>=0?"+":"−")+fm(Math.abs(x.ch)))},
        x.ch==null||!x.prv?"—":SP((x.cur/x.prv-1)*100)+"%"]}))
      .concat([{tot:1,c:["Total / recomputed",fm(cur),prv==null?"—":fm(prv),
        prv==null?"—":(cur-prv>=0?"+":"−")+fm(Math.abs(cur-prv)),
        prv?SP((cur/prv-1)*100)+"%":"—"]}])));
    r3.appendChild(ct);v.appendChild(r3);
    if(ADDITIVE.indexOf(S.meas)<0)v.appendChild(h("div","note",
      "The total row is recomputed from the pooled invoice rows at company scope, not summed or averaged from the seller rows above. That is why it will not equal the arithmetic of the column."));
  }

  /* ── Margin & price ── */
  if(tab===2){
    const r1=row("g4");
    r1.appendChild(KPIc("Gross margin % (product)",b=>b.mgnP,v2=>P(v2),{pp:1,
      sub:"maintained target "+P(g.mgnTarget)}));

      sub:P(g.cur.rev?g.cur.reb/g.cur.rev*100:0,2)+" of product sales"}));
    v.appendChild(r1);
    /* Price discipline and margin are different mechanisms. A line can hold its
       margin percentage while being invoiced below its contracted price. */
    const r1b=row("g4");
    r1b.appendChild(KPI({label:"Price vs contract",value:P(g.cur.priceIdx,1),
      cmp:g.prv?SP(g.cur.priceIdx-g.prv.priceIdx,1)+"pp":"no comparable history",
      dir:g.prv?(g.cur.priceIdx>=g.prv.priceIdx?1:-1):0,cmpL:g.prv?CMPLBL():"",
      sub:"100% = invoiced at the contracted price"}));
    r1b.appendChild(KPI({label:"Price leakage",value:M(g.cur.leak),
      cmp:"contract value "+M(g.cur.cRev),dir:g.cur.priceIdx>=99.5?1:-1,cmpL:"in the window"}));
    r1b.appendChild(KPI({label:"Contract ASP per kg",value:PKG(g.cur.cAsp),
      cmp:SP(g.cur.asp-g.cur.cAsp,2),dir:g.cur.asp>=g.cur.cAsp?1:-1,
      cmpL:"realised minus contract",sub:"realised "+PKG(g.cur.asp)}));
    r1b.appendChild(KPI({label:"Classes below contract",
      value:g.clsRows.filter(c=>c.pidx<99.5).length+" of "+g.clsRows.length,
      sub:"more than 0.5% under the contracted price"}));
    v.appendChild(r1b);
    const r2=row("g2");
    const c1=card("Gross margin % trend","monthly, both definitions");
    c1.appendChild(legend([["var(--cat-1)","Product",1],["var(--cat-2)","Product + other",1],["var(--text-primary)","Maintained target",1]]));
    c1.appendChild(line([{n:"Product",d:g.trend.map(t=>t.mgn),l:g.trend.map(t=>t.label)},
      {n:"Product + other",d:g.trend.map(t=>t.mgnT),l:g.trend.map(t=>t.label)}],
      {ref:g.mgnTarget,refLabel:"target "+P(g.mgnTarget)}));
    const c2=card("Average selling price per kg","ASP");
    c2.appendChild(line([{n:"ASP per kg",d:g.trend.map(t=>t.asp),l:g.trend.map(t=>t.label)}],{fmt:PKG}));

    const r3=row("g2");
    const c4=card("Product sales vs other sales");
    c4.appendChild(legend([["var(--cat-1)","Product sales"],["var(--cat-2)","Other sales — header charges"]]));
    c4.appendChild(barStack([["Product sales",g.cur.rev,"var(--cat-1)"],["Other sales",g.cur.oth,"var(--cat-2)"]],{pr:112}));
    const othM=g.cur.oth?(g.cur.oth-g.cur.othCost)/g.cur.oth*100:0;
    c4.appendChild(tbl(["Component","Source",{t:"Value",n:1},{t:"Share",n:1},{t:"Margin %",n:1}],
      [["Product sales","Sales invoice line",M(g.cur.rev),P(g.cur.tot?g.cur.rev/g.cur.tot*100:0),P(g.cur.mgnP)],
       ["Other sales","Sales miscellaneous charge, on the invoice header",M(g.cur.oth),
        P(g.cur.tot?g.cur.oth/g.cur.tot*100:0),P(othM)],
       {tot:1,c:["Total sales","",M(g.cur.tot),"100.0%",P(g.cur.mgnT)]}]));

    const c5=card("Transaction economics");
    c5.appendChild(tbl(["Measure",{t:"Current",n:1},{t:"Comparison",n:1},{t:"Change",n:1}],
      [["# Transactions",N(g.cur.tx),g.prv?N(g.prv.tx):"—",g.prv?SP((g.cur.tx/(g.prv.tx||1)-1)*100)+"%":"—"],
       ["# Invoice lines",N(g.cur.lines),g.prv?N(g.prv.lines):"—",g.prv?SP((g.cur.lines/(g.prv.lines||1)-1)*100)+"%":"—"],
       ["# Orders shipped",N(g.cur.orders),g.prv?N(g.prv.orders):"—",g.prv?SP((g.cur.orders/(g.prv.orders||1)-1)*100)+"%":"—"],
       ["ATV — total sales per transaction",M(g.cur.atv),g.prv?M(g.prv.atv):"—",g.prv&&g.prv.atv?SP((g.cur.atv/g.prv.atv-1)*100)+"%":"—"],
       ["ASP — product sales per kg",PKG(g.cur.asp),g.prv?PKG(g.prv.asp):"—",g.prv&&g.prv.asp?SP((g.cur.asp/g.prv.asp-1)*100)+"%":"—"],
       ["Customer OTIF",P(g.cur.otif),g.prv?P(g.prv.otif):"—",g.prv?SP(g.cur.otif-g.prv.otif)+"pp":"—"]]));
    r3.appendChild(c4);r3.appendChild(c5);v.appendChild(r3);
    v.appendChild(h("div","note","Freight, tariff and handling sit on the invoice header, so they raise total sales and dilute margin without touching price per kg. Excluding them is what keeps ASP honest — and it is why two gross-margin definitions have to coexist rather than one replacing the other."));
    const r4=row("g1");
    const c3=card("Product sales, price and margin by class","product sales only — header charges have neither a contract price nor a class");
    c3.appendChild(tbl(["Product class",{t:"Product sales",n:1},{t:"Volume",n:1},
        {t:"Contract / kg",n:1},{t:"ASP / kg",n:1},{t:"vs contract",n:1},{t:"Leakage",n:1},
        {t:"Target %",n:1},{t:"Margin %",n:1}],
      g.clsRows.map(d=>({c:[d.n,M(d.rev),KG(d.kg),PKG(d.cppk),PKG(d.ppk),
        {html:chip(d.pidx>=99.5?"ok":d.pidx>=98?"warn":"err",P(d.pidx,1))},M(d.leak),P(d.tgt),
        {html:chip(d.mgn>=d.tgt?"ok":d.mgn>=d.tgt-2?"":"warn",P(d.mgn))}]}))
      .concat([{tot:1,c:["Total product",M(g.cur.rev),KG(g.cur.kg),PKG(g.cur.cAsp),PKG(g.cur.asp),
                 P(g.cur.priceIdx,1),M(g.cur.leak),P(g.mgnTarget),{html:P(g.cur.mgnP)}]},
               {tot:1,c:["Other sales (invoice header)",M(g.cur.oth),"—","—","—","—","—","—",
                 {html:P(g.cur.oth?(g.cur.oth-g.cur.othCost)/g.cur.oth*100:0)}]}])));
    r4.appendChild(c3);v.appendChild(r4);
    v.appendChild(reconLine());
  }

  /* ── Customers ── */
  if(tab===3){
    const segBy={};g.seg.forEach(o=>segBy[o.c.id]=o);
    const r1=row("g1");
    const c=card("Customers",PLABEL[S.period]+" · banded at "+fmtDay(g.b));
    c.appendChild(tbl(["Customer","Category","Status",{t:"ABC",n:1},{t:"Product sales",n:1},{t:"Other",n:1},
        {t:"Classes",n:1},{t:"Days since order",n:1},"Trend","Credit"],
      g.byCust.map(x=>{const s=segBy[x.id]||{};
        return {c:[x.n,x.cat,
          {html:s.status==="Lost"?chip("err","Lost"):s.status==="At risk"?chip("warn","At risk"):
                s.status==="Loyal"?chip("ok","Loyal"):s.status==="Acquired"?chip("pri","Acquired"):chip("",s.status||"—")},
          s.abc||"—",M(x.rev),M(x.oth),String(x.classes.length),
          {html:s.rec==null?"—":s.rec>90?chip("warn",N(s.rec)):String(s.rec)},
          {html:s.trend==="Up"?chip("ok","Up"):s.trend==="Down"?chip("err","Down"):chip("",s.trend||"—")},
          {html:(()=>{const ar=G.ar[x.id].bal,u=x.lim?ar/x.lim*100:0;
            return ar>x.lim?chip("err","over limit"):u>85?chip("warn",P(u,0)):chip("ok",P(u,0));})()}],
          click:()=>{S.cust=x.id;S.from=0;S.sheet=2;S.tab=0;draw();}};})));
    r1.appendChild(c);v.appendChild(r1);
    const r2b=row("g2");
    const cA=card("Product sales by customer category","Base · trade — Customer Category Hierarchy");
    cA.appendChild(barH(g.byCat.map(x=>[x.cat,x.rev,"price vs contract "+P(x.pidx,1)]),{lw:110}));
    const cB=card("Product sales by class");
    cB.appendChild(barH(g.byClass,{lw:150}));
    r2b.appendChild(cA);r2b.appendChild(cB);v.appendChild(r2b);
    const r2=row("g1");
    const c3=card("Accounts past expected reorder","ERP reorder cadence, not the RFM band");
    c3.appendChild(tbl(["Customer","Overdue class",{t:"Expected every",n:1},{t:"Days over",n:1}],
      g.decay.slice(0,12).map(o=>({c:[o.c.n,CLSN[o.cl.ci],o.cl.interval+"d",
        {html:o.over>o.cl.interval?chip("err",N(o.over)):chip("warn",N(o.over))}],
        click:()=>{S.cust=o.c.id;S.from=0;S.sheet=2;S.tab=1;draw();}}))));
    r2.appendChild(c3);v.appendChild(r2);
    v.appendChild(h("div","note",
      "Two different mechanisms are shown deliberately. The Status column is an RFM band — recency, frequency and monetary value over a trailing year. "+
      "Accounts past expected reorder reads the ERP reorder cadence at customer x product grain. An account can be Active on one and overdue on the other."));
  }

  /* ── Segments: the banding rules and the customer counts they produce ── */
  if(tab===4){
    const seg=g.seg;
    const r1=row("gauto");
    const mk=(l,k,ic)=>KPI({label:l,value:N(g.segCount(k)),icon:ic||"groups",
      sub:P(seg.length?g.segCount(k)/seg.length*100:0,0)+" of "+seg.length+" accounts"});
    r1.appendChild(mk("# Acquired customers","acquired"));
    r1.appendChild(mk("# Active customers","active"));
    r1.appendChild(mk("# Loyal customers","loyal"));
    r1.appendChild(mk("# Repeat customers","repeat"));
    r1.appendChild(mk("# High volume customers","high"));
    r1.appendChild(mk("# At risk customers","atRisk"));
    r1.appendChild(mk("# Lost customers","lost"));
    v.appendChild(r1);
    v.appendChild(h("div","note",
      "These are bands, not a partition — the same account can be Active, Repeat, Loyal and High volume at once, which is why the counts do not sum to the roster. "+
      "Every threshold below is a rule against a source column, written to a target column: in the real product they are configurable per customer."));
    const cnt=(key,order)=>{const m={};seg.forEach(o=>{m[o[key]]=(m[o[key]]||0)+1;});
      return order.filter(x=>m[x]).map(x=>[x,m[x]]);};
    const r2=row("g2");
    const c1=card("Recency band","Rule: Customer Insights · Days Since Last Activity → Recency Band");
    c1.appendChild(barH(cnt("recB",RECB.map(x=>x[1])),{fmt:N,lw:96,pr:44}));
    const c2=card("Frequency band","Rule: Customer Insights · Number Sales Txns → Frequency Band · trailing 12 months");
    c2.appendChild(barH(cnt("freqB",FRQB.map(x=>x[1])),{fmt:N,lw:96,pr:44}));
    r2.appendChild(c1);r2.appendChild(c2);v.appendChild(r2);
    const r3=row("g2");
    const c3=card("ABC band","Rule: Customer Insights · Net Sales Amount → ABC Band · percentage banding, A to 80%, B to 95%, C the rest");
    c3.appendChild(barH(cnt("abc",["A","B","C","—"]),{fmt:N,lw:96,pr:44}));
    const c4=card("Sales trend direction","Rule: Customer Insights · Net Sales Amount → Trend Direction · trailing 3 months vs the same 3 a year earlier, ±5% dead band");
    c4.appendChild(barH(cnt("trend",["Up","Flat","Down","—"]),{fmt:N,lw:96,pr:44}));
    r3.appendChild(c3);r3.appendChild(c4);v.appendChild(r3);
    const r4=row("g1");
    const c5=card("Customer bands","every band, evaluated at "+fmtDay(g.b));
    c5.appendChild(tbl(["Customer","Category",{t:"Trailing 12-mo sales",n:1},{t:"Share",n:1},"ABC",
        {t:"Recency",n:1},"Recency band",{t:"Txns 12 mo",n:1},"Frequency band","Relationship","Trend","Status"],
      seg.slice().sort((a,b)=>b.mon-a.mon).map(o=>({c:[o.c.n,o.c.cat,M(o.mon),P(o.share||0),
        {html:o.abc==="A"?chip("pri","A"):o.abc==="B"?chip("","B"):o.abc==="C"?chip("","C"):"—"},
        o.rec>=9999?"never":N(o.rec),o.recB,N(o.freq),o.freqB,o.relB,
        {html:o.trend==="Up"?chip("ok","Up"):o.trend==="Down"?chip("err","Down"):chip("",o.trend)},
        {html:o.status==="Lost"?chip("err","Lost"):o.status==="At risk"?chip("warn","At risk"):
              o.status==="Loyal"?chip("ok","Loyal"):o.status==="Acquired"?chip("pri","Acquired"):chip("",o.status)}],
        click:()=>{S.cust=o.c.id;S.from=0;S.sheet=2;S.tab=0;draw();}}))));
    r4.appendChild(c5);v.appendChild(r4);
    v.appendChild(h("div","note",
      "Band definitions on this sheet: Acquired = first invoice within 365 days · Active = invoiced within 90 days · "+
      "Repeat = 2 or more transactions in the trailing 12 months · Loyal = relationship 540 days or more, 8 or more transactions, and active · "+
      "High volume = ABC band A · At risk = last invoice 91 to 365 days ago, or active but declining with recency over 45 days · Lost = no invoice in 365 days."));
  }

  /* ── Pipeline ── */
  if(tab===5){
    const r1=row("g4");
    r1.appendChild(KPI({label:"Open pipeline",value:M(g.pipeTot),
      sub:"open at "+fmtDay(g.b)+" · CRM opportunity = quote header"}));
    r1.appendChild(KPI({label:"Coverage vs remaining plan",value:g.cov==null?"n/a":g.cov.toFixed(1)+"×",
      sub:g.cov==null?"plan for this period already met":M(Math.max(g.plan-g.cur.tot,0))+" still to plan"}));
    r1.appendChild(KPI({label:"Quote-to-order conversion",value:g.qN>=10?P(g.qconv):"—",
      sub:g.qN?g.qN+" quotes decided in "+PLABEL[S.period]:"no quotes decided in this window",
      cmp:g.qN<10?"denominator under 10 — rate suppressed":(g.qN<=20?"denominator "+g.qN+" — treat as indicative":null),
      dir:0}));
    r1.appendChild(KPI({label:"New pipeline created",value:M(g.newPipe),
      sub:"opportunities created in "+PLABEL[S.period]}));
    v.appendChild(r1);
    const r2=row("g2");
    const c1=card("Pipeline by stage","stage as at "+fmtDay(g.b));c1.appendChild(funnel(g.pipeStage));
    const c2=card("Unconverted quotes by age","Rule: Open Sales Quote · Quote Date → Quote Age Band · "+M(g.qOpen)+" open at "+fmtDay(g.b));
    c2.appendChild(barH(g.qAge,{lw:96}));
    r2.appendChild(c1);r2.appendChild(c2);v.appendChild(r2);
    v.appendChild(winLossRow(g));
    const r3=row("g1");
    const c3=card("Open order book by age band","Rule: Open Sales Order · Order Date → Order Age Band · "+M(g.open)+" open at "+fmtDay(g.b));
    c3.appendChild(barH(g.openAge,{lw:96}));
    r3.appendChild(c3);v.appendChild(r3);
  }
  return v;
}

      g.reps.slice().sort((a,b)=>b.att-a.att).map(r=>({c:[r.n,r.team,M(r.tot),M(r.plan),

  /* ── Accounts: health, order frequency, DSO, the reorder queue ── */

        {html:o.over>o.cl.interval?chip("err",N(o.over)):chip("warn",N(o.over))},

        {html:G.ar[o.c.id].bal>o.c.lim?chip("err","over limit"):G.ar[o.c.id].bal/o.c.lim>0.85?chip("warn","near limit"):chip("ok","ok")}],
        click:()=>{S.cust=o.c.id;S.from=1;S.sheet=2;S.tab=1;draw();}})))

    r3.appendChild(c2);v.appendChild(r3);

    const r4=row("g2");
    const c3=card("Accounts by status band","Rule: Customer Insights · recency, frequency and trend → Status");
    const cnt={};g.seg.forEach(o=>{cnt[o.status]=(cnt[o.status]||0)+1;});

    const c4=card("Credit exposure","accounts over or near the approved limit");

      sub:N(late)+" late · "+N(shrt)+" short-shipped"}));

    v.appendChild(h("div","note",
      "Price leakage is the gap between what the contract says and what the invoice charged: contract value "+
      "minus invoiced value, at invoice-line grain. It is a different mechanism from margin erosion — a line can "+
      "hold its margin percentage while being sold below its contracted price, because cost moved too. "+
      "This measure needs contract price at customer × product with effective dates, which has no confirmed "+
      "source table yet; the figures here come from the demo's own contract prices."));

    const r2=row("g2");
    const c1=card("Price variance from contract, by customer","the twelve furthest from contract, in percentage points");
    const pvc=g.byCust.filter(c=>c.pidx!=null)
      .sort((a,b)=>Math.abs(b.pidx-100)-Math.abs(a.pidx-100)).slice(0,12)
      .sort((a,b)=>a.pidx-b.pidx);
    c1.appendChild(barH(pvc.map(c=>[c.n,c.pidx-100,
      "invoiced "+P(c.pidx,1)+" of contract · leakage "+M(c.leak)]),
      {fmt:x=>SP(x,1)+"pp",lw:170,pr:70}));
    const c2=card("Price leakage by seller",PLABEL[S.period]);
    c2.appendChild(barH(g.reps.slice().sort((a,b)=>b.cur.leak-a.cur.leak)
      .map(r=>[r.n,r.cur.leak,P(r.cur.priceIdx,1)+" of contract"]),{lw:130}));
    r2.appendChild(c1);r2.appendChild(c2);v.appendChild(r2);

    const r3=row("g1");
    const c3=card("Price variance detail","by customer, product sales only — header charges have no contract price");
    c3.appendChild(tbl(["Customer","Category","Owner",{t:"Invoiced",n:1},{t:"Contract value",n:1},
        {t:"Leakage",n:1},{t:"Price vs contract",n:1}],
      g.byCust.filter(c=>c.cRev>0).sort((a,b)=>b.leak-a.leak).map(c=>({c:[c.n,c.cat,
        (REPS.find(r=>r.id===c.rep)||{}).n,M(c.rev),M(c.cRev),M(c.leak),
        {html:chip(c.pidx>=99.5?"ok":c.pidx>=98?"warn":"err",P(c.pidx,1))}],
        click:()=>{S.cust=c.id;S.from=1;S.sheet=2;S.tab=0;draw();}}))
      .concat([{tot:1,c:["Total / recomputed","","",M(g.cur.rev),M(g.cur.cRev),M(g.cur.leak),
        P(g.cur.priceIdx,1)]}])));
    r3.appendChild(c3);v.appendChild(r3);

    const r4=row("g2");
    const c4=card("Service failure rate by seller","share of orders not on time and in full");
    c4.appendChild(barH(g.reps.slice().sort((a,b)=>a.otif-b.otif)
      .map(r=>[r.n,100-r.otif,N(r.cur.orders)+" orders shipped"]),{fmt:x=>P(x,1),lw:130,pr:56}));
    const c5=card("Orders shipping in the next 7 days",S.so!=="all"?S.so+" only":"from "+fmtDay(g.b));
    c5.appendChild(g.ship7.length?tbl(["Customer","Product class","Owner",{t:"Volume",n:1},{t:"Value",n:1},{t:"Ships in",n:1},"Type"],
      g.ship7.slice(0,14).map(o=>[(CMAP[o.cust]||{}).n,CLSN[o.ci],(REPS.find(r=>r.id===o.rep)||{}).n,
        KG(o.kg),M(o.rev),(o.shipDay-g.b)+"d",
        {html:o.blanket?chip("","blanket"):chip("","order")}]))
      :h("div","rule","Nothing confirmed in the next 7 days under this filter."));
    r4.appendChild(c4);r4.appendChild(c5);v.appendChild(r4);
  }

  /* ── Pipeline ── */
  if(tab===3){
    const r1=row("g4");
    r1.appendChild(KPI({label:"Open pipeline",value:M(g.pipeTot),
      sub:"open at "+fmtDay(g.b)+" · CRM opportunity = quote header"}));
    r1.appendChild(KPI({label:"Coverage vs remaining plan",value:g.cov==null?"n/a":g.cov.toFixed(1)+"×",

    r1.appendChild(KPI({label:"Win rate",value:g.qN>=10?P(g.qconv):"—",

      sub:"opportunities created in "+PLABEL[S.period]}));

    r3.appendChild(c3);v.appendChild(r3);
  }
  return v;
}

/* Win/loss by product class and by customer category. Shared by both
   dashboards. The denominator travels with every rate and a rate on fewer
   than ten decided quotes is suppressed, not shown small. */
function winLossRow(g){
  const r=row("g2");
  const c1=card("Win/loss by product class","quotes decided in "+PLABEL[S.period]);
  c1.appendChild(g.wlClass.length?tbl(["Product class",{t:"Decided",n:1},{t:"Won",n:1},{t:"Win rate",n:1},{t:"Value won",n:1}],
    g.wlClass.map(x=>[x.k,N(x.n),N(x.w),
      {html:x.n<10?'<span style="color:var(--text-tertiary)">n='+x.n+' · suppressed</span>'
            :chip(x.rate>=40?"ok":x.rate>=25?"warn":"err",P(x.rate,0))},
      M(x.wamt)])
    .concat([{tot:1,c:["Total / recomputed",N(g.qN),N(g.qres.filter(q=>q.won).length),
      g.qN>=10?P(g.qconv,0):"—",M(g.qres.filter(q=>q.won).reduce((s,q)=>s+q.amt,0))]}]))
    :h("div","rule","No quotes were decided in this window."));
  const c2=card("Win/loss by customer category","quotes decided in "+PLABEL[S.period]);
  c2.appendChild(g.wlCat.length?tbl(["Category",{t:"Decided",n:1},{t:"Won",n:1},{t:"Win rate",n:1},{t:"Value won",n:1}],
    g.wlCat.map(x=>[x.k,N(x.n),N(x.w),
      {html:x.n<10?'<span style="color:var(--text-tertiary)">n='+x.n+' · suppressed</span>'
            :chip(x.rate>=40?"ok":x.rate>=25?"warn":"err",P(x.rate,0))},
      M(x.wamt)]))
    :h("div","rule","No quotes were decided in this window."));
  r.appendChild(c1);r.appendChild(c2);
  return r;
}

/* ── Account detail: a drill-through reached by clicking a customer, not a
   persona dashboard. It carries no rail entry. ── */
function sheetACCT(tab){
  const v=h("div"),g=G;
  v.appendChild(toolbar());
  const L=custList().length?custList():CUST.filter(c=>c.co===coK());
  const c0=L.find(x=>x.id===S.cust)||L[0];
  if(!c0)return h("div","rule","No accounts in this company under the current filters.");
  const sg=g.seg.find(o=>o.c.id===c0.id)||{};
  const pick=h("div","card"),pb=h("div","card-toolbar");
  const back=h("button","chip pri","← Back to "+SHEETS[S.from||0].n);
  back.addEventListener("click",()=>{S.sheet=S.from||0;S.tab=0;draw();});
  pb.appendChild(back);
  pb.appendChild(fld("Account",sel("fAcct",L.map(c=>[c.id,c.n]),c0.id,x=>{S.cust=x;draw();}),1.4));
  pb.appendChild(h("div","sp"));
  pb.appendChild(h("div",null,
    (sg.status==="Lost"?chip("err","Lost"):sg.status==="At risk"?chip("warn","At risk"):
     sg.status==="Loyal"?chip("ok","Loyal"):sg.status==="Acquired"?chip("pri","Acquired"):chip("",sg.status||"—"))+" "+
    chip("","ABC "+(sg.abc||"—"))+" "+chip("",c0.cat)+" "+
    chip("","Owner: "+(REPS.find(r=>r.id===c0.rep)||{}).n)));
  pick.appendChild(pb);
  v.appendChild(pick);

  const iv=INV.filter(x=>x.cust===c0.id);
  const cur=bundle(iv,g.a,g.z), prv=g.cmpOK?bundle(iv,g.ca,g.cz):null;
  const dd=(x,y,pp)=>prv==null?{cmp:"no comparable history",dir:0}:
    {cmp:pp?SP(x-y)+"pp":(y?SP((x/y-1)*100)+"%":"n/a"),dir:x>=y?1:-1,cmpL:CMPLBL()};
  const oo=OPEN.filter(o=>o.cust===c0.id&&o.orderDay<=g.b&&o.shipDay>g.b
    &&(S.so==="all"||(S.so==="blanket")===o.blanket));

  if(tab===0){
    const r1=row("g4");
    r1.appendChild(KPI({label:"Sales — "+PLABEL[S.period],value:M(cur.tot),
      ...dd(cur.tot,prv?prv.tot:0),sub:"product "+M(cur.rev)+" · other "+M(cur.oth)+" · "+KG(cur.kg)}));
    r1.appendChild(KPI({label:"Gross margin % (product)",value:P(cur.mgnP),
      cmp:SP(cur.mgnP-g.mgnTarget)+"pp",dir:cur.mgnP>=g.mgnTarget?1:-1,cmpL:"vs maintained target",
      sub:"product + other "+P(cur.mgnT)}));
    r1.appendChild(KPI({label:"Price vs contract",value:cur.cRev?P(cur.priceIdx,1):"—",
      cmp:cur.cRev?M(cur.leak)+" leakage":null,dir:cur.priceIdx>=99.5?1:-1,cmpL:cur.cRev?"in the window":""}));
    r1.appendChild(KPI({label:"Open orders",value:M(oo.reduce((s,o)=>s+o.rev,0)),icon:"truck",
      sub:KG(oo.reduce((s,o)=>s+o.kg,0))+" · "+oo.length+" lines"}));
    v.appendChild(r1);
    const r1b=row("g4");
    r1b.appendChild(KPI({label:"ABC band",value:sg.abc||"—",
      sub:sg.share!=null?P(sg.share)+" of company trailing-12-month sales":""}));
    r1b.appendChild(KPI({label:"Recency",value:sg.rec>=9999?"never":N(sg.rec)+" d",
      sub:"band "+(sg.recB||"—")}));
    r1b.appendChild(KPI({label:"Orders, trailing 12 months",value:N(sg.freq||0),
      sub:"band "+(sg.freqB||"—")+" · relationship "+(sg.relB||"—")}));
    r1b.appendChild(KPI({label:"Sales trend",value:sg.trend||"—",
      cmp:sg.trPct==null?null:SP(sg.trPct)+"%",dir:sg.trend==="Up"?1:sg.trend==="Down"?-1:0,
      cmpL:"trailing 3 months vs the same 3 last year"}));
    v.appendChild(r1b);
    const r2=row("g2");
    const c1=card("Product sales by class",PLABEL[S.period]);
    const byC={};LINES.forEach(l=>{if(l.cust!==c0.id||l.d<g.a||l.d>g.z)return;byC[l.ci]=(byC[l.ci]||0)+l.rev;});
    c1.appendChild(barH(Object.keys(byC).map(k=>[CLSN[k],byC[k]]).sort((a,b)=>b[1]-a[1]),{lw:150}));
    const c2=card("Sales and volume by year","to the as-of date in the current year");
    const yNow=dt(g.b).getUTCFullYear();
    c2.appendChild(tbl([{t:"Year"},{t:"Product sales",n:1},{t:"Other",n:1},{t:"Volume",n:1},
        {t:"ASP / kg",n:1},{t:"Price vs contract",n:1},{t:"Margin %",n:1}],
      [yNow-2,yNow-1,yNow].map(y=>{const a2=di(y,0,1),z2=Math.min(di(y,11,31),g.b);
        if(z2<a2)return [String(y),"—","—","—","—","—","—"];
        const bb=bundle(iv,a2,z2);
        return [y===yNow?y+" to as-of":String(y),M(bb.rev),M(bb.oth),KG(bb.kg),
          bb.kg?PKG(bb.asp):"—",bb.cRev?P(bb.priceIdx,1):"—",bb.rev?P(bb.mgnP):"—"];})));
    r2.appendChild(c1);r2.appendChild(c2);v.appendChild(r2);
    const r3=row("g2");
    const c3=card("Open pipeline and quotes for this account","at "+fmtDay(g.b));
    const ap=PIPE.filter(p=>p.cust===c0.id&&p.createDay<=g.b&&p.closeDay>g.b);
    const aq=g.qOpenRows.filter(q=>q.cust===c0.id);
    c3.appendChild((ap.length||aq.length)?tbl(["Type","Product class",{t:"Amount",n:1},{t:"Age",n:1},"Stage / status"],
      ap.map(p=>["Opportunity",CLSN[p.ci],M(p.amt),(g.b-p.createDay)+"d",
        {html:chip("",STAGE[Math.max(0,Math.min(p.tgt,Math.floor((g.b-p.createDay)/p.life*5)))])}])
      .concat(aq.map(q=>["Quote",CLSN[q.ci],M(q.amt),(g.b-q.createDay)+"d",{html:chip("","awaiting decision")}])))
      :h("div","rule","No open opportunity or quote for this account at the as-of date."));
    const c4=card("Price variance by product class",PLABEL[S.period]);
    const pv={};LINES.forEach(l=>{if(l.cust!==c0.id||l.d<g.a||l.d>g.z)return;
      const o=pv[l.ci]||(pv[l.ci]={rev:0,cRev:0,kg:0});o.rev+=l.rev;o.cRev+=l.cRev;o.kg+=l.kg;});
    const pvr=Object.keys(pv).map(k=>({n:CLSN[k],...pv[k],idx:pv[k].cRev?pv[k].rev/pv[k].cRev*100:0}))
      .sort((a,b)=>a.idx-b.idx);
    c4.appendChild(pvr.length?tbl(["Product class",{t:"Contract / kg",n:1},{t:"Invoiced / kg",n:1},
        {t:"Leakage",n:1},{t:"vs contract",n:1}],
      pvr.map(x=>[x.n,PKG(x.cRev/x.kg),PKG(x.rev/x.kg),M(x.cRev-x.rev),
        {html:chip(x.idx>=99.5?"ok":x.idx>=98?"warn":"err",P(x.idx,1))}]))
      :h("div","rule","No invoiced lines for this account in the window."));
    r3.appendChild(c3);r3.appendChild(c4);v.appendChild(r3);
  }
  if(tab===1){
    const r1=row("g4");
    r1.appendChild(KPI({label:"Customer OTIF",value:P(cur.otif),icon:"truck",
      ...dd(cur.otif,prv?prv.otif:0,1),sub:N(cur.orders)+" orders in the window"}));
    r1.appendChild(KPI({label:"Orders late",value:N(iv.filter(x=>x.d>=g.a&&x.d<=g.z&&x.late).length),
      sub:"delivered after the promised date",icon:"truck"}));
    r1.appendChild(KPI({label:"Orders short-shipped",value:N(iv.filter(x=>x.d>=g.a&&x.d<=g.z&&x.short).length),
      sub:"delivered incomplete",icon:"truck"}));
    r1.appendChild(KPI({label:"Order frequency, trailing 12 months",value:N(sg.freq||0),
      sub:"ERP Customer Product Order Frequency"}));
    v.appendChild(r1);
    const r2=row("g1");
    const c=card("Reorder cadence by product class","ERP Date Next Order / Reorder Week, read at "+fmtDay(g.b));
    c.appendChild(tbl(["Product class",{t:"Orders / yr",n:1},{t:"Expected every",n:1},{t:"Last order",n:1},
        {t:"Days since",n:1},{t:"Days over",n:1},"Status"],
      c0.classes.map(x=>{const ld=lastOn(x,g.b);
        if(ld<0)return [CLSN[x.ci],String(x.perYear),x.interval+"d","never","—","—",{html:chip("","never ordered")}];
        const since=g.b-ld,over=Math.round(since-x.interval);
        return [CLSN[x.ci],String(x.perYear),x.interval+"d",fmtDay(ld).slice(4),N(since),over>0?N(over):"—",
          {html:over>x.interval?chip("err","overdue"):over>0?chip("warn","late"):chip("ok","on cadence")}];})));
    r2.appendChild(c);v.appendChild(r2);
    const r3=row("g2");
    const c2=card("Volume by product class",PLABEL[S.period]);
    const byK={};LINES.forEach(l=>{if(l.cust!==c0.id||l.d<g.a||l.d>g.z)return;byK[l.ci]=(byK[l.ci]||0)+l.kg;});
    c2.appendChild(barH(Object.keys(byK).map(k=>[CLSN[k],byK[k]]).sort((a,b)=>b[1]-a[1]),{fmt:KG,lw:150}));
    const c3=card("Open orders",S.so!=="all"?S.so+" only":"open at "+fmtDay(g.b));
    c3.appendChild(oo.length?tbl(["Product class",{t:"Volume",n:1},{t:"Value",n:1},{t:"Ordered",n:1},{t:"Ships in",n:1},"Type"],
      oo.sort((a,b)=>a.shipDay-b.shipDay).slice(0,12).map(o=>[CLSN[o.ci],KG(o.kg),M(o.rev),
        (g.b-o.orderDay)+"d ago",(o.shipDay-g.b)+"d",
        {html:o.blanket?chip("","blanket"):chip("","order")}]))
      :h("div","rule","No open orders under this filter."));
    r3.appendChild(c2);r3.appendChild(c3);v.appendChild(r3);
  }
  if(tab===2){
    const r1=row("g4");
    const AR=G.ar[c0.id];
    r1.appendChild(KPI({label:"A/R balance",value:M0(AR.bal),
      cmp:AR.past>0?M0(AR.past):"none",dir:AR.past>0?-1:1,cmpL:"past due",
      sub:"on "+M0(AR.t12)+" trailing 12-month sales"}));
    r1.appendChild(KPI({label:"DSO",value:AR.dso?AR.dso.toFixed(0)+" days":"—",
      cmp:AR.dsoPrior?SP(AR.dso-AR.dsoPrior,0)+"d":"no prior window",
      dir:AR.dso<=AR.dsoPrior?1:-1,cmpL:"vs the window 90 days earlier"}));
    r1.appendChild(KPI({label:"Average days to pay",value:AR.dtp.toFixed(1),
      cmp:SP(AR.dtp-c0.dtpP)+"d",dir:AR.dtp<=c0.dtpP?1:-1,cmpL:"vs prior 3 months"}));
    r1.appendChild(KPI({label:"Credit utilisation",value:P(c0.lim?AR.bal/c0.lim*100:0,0),
      cmp:AR.bal>c0.lim?"over limit":AR.bal/c0.lim>0.85?"near limit":"headroom",
      dir:AR.bal>c0.lim?-1:AR.bal/c0.lim>0.85?0:1}));
    v.appendChild(r1);
    const r2=row("g1");
    const c1=card("Credit utilisation");
    c1.appendChild(gauge(AR.bal,c0.lim,{label:"of approved limit",notes:[
      ["A/R balance",M0(AR.bal)],["Approved limit",M0(c0.lim)],
      ["Headroom",M0(Math.max(c0.lim-AR.bal,0)),AR.bal>c0.lim?"var(--neg)":"var(--pos)"]]}));
    r2.appendChild(c1);v.appendChild(r2);
    const r3=row("g2");
    const c2=card("A/R aging","Rule: Open AR · Due Date → Age Band");
    c2.appendChild(legend([["var(--cat-1)","Current"],["var(--fb-warning)","31–60"],["var(--fb-error)","61+"]]));
    c2.appendChild(barStack([["Current",AR.bal-AR.past,"var(--cat-1)"],
      ["31–60",AR.past*0.55,"var(--fb-warning)"],["61+",AR.past*0.45,"var(--fb-error)"]],{pr:96}));
    const c3=card("Payment behaviour");
    c3.appendChild(tbl([{t:"Window"},{t:"Avg days to pay",n:1},{t:"Change",n:1},"Read"],
      [["Trailing 3 months",AR.dtp.toFixed(1),SP(AR.dtp-c0.dtpP)+"d",
        {html:AR.dtp-c0.dtpP>5?chip("err","slowing materially"):AR.dtp-c0.dtpP>1?chip("warn","slowing"):chip("ok","stable or better")}],
       ["Prior 3 months",c0.dtpP.toFixed(1),"—",{html:chip("","baseline")}]]));
    r3.appendChild(c2);r3.appendChild(c3);v.appendChild(r3);
  }
  return v;
}

/* ══ RENDER ══ */
function drawRail(){
  const r=document.getElementById("rail");r.innerHTML="";
  const lg=h("div","rail-logo","D");lg.title="Datacor";r.appendChild(lg);
  const mb=h("button","rail-btn",svgIcon("menu"));
  mb.setAttribute("aria-label","Navigation");mb.title="Navigation";r.appendChild(mb);
  r.appendChild(h("div","rail-div"));
  SHEETS.forEach((s,i)=>{
    if(s.hidden)return;
    const b=h("button","rail-btn",svgIcon(s.icon||"leaderboard"));
    b.setAttribute("aria-label",s.n);b.title=s.n;
    /* while in the account drill-through, the dashboard it was entered from
       stays marked as current — the drill is a detour, not a destination */
    const cur=S.sheet===i||!!(SHEETS[S.sheet].hidden&&(S.from||0)===i);
    b.setAttribute("aria-current",String(cur));
    b.addEventListener("click",()=>{S.sheet=i;S.tab=0;draw();});r.appendChild(b);});
  r.appendChild(h("div","rail-sp"));
  r.appendChild(h("div","rail-div"));
  const th=h("button","rail-btn",svgIcon("palette"));
  th.setAttribute("aria-label","Mode: "+S.mode+" — click to cycle Light, Dark, Blue");
  th.title="Mode: "+S.mode;
  th.addEventListener("click",()=>{S.mode=MODES[(MODES.indexOf(S.mode)+1)%3];
    document.documentElement.setAttribute("data-mode",S.mode);draw();});
  r.appendChild(th);
  ["help","settings"].forEach(k=>{const b=h("button","rail-btn",svgIcon(k));
    b.setAttribute("aria-label",k);b.title=k;r.appendChild(b);});
}
function draw(){
  const sh=SHEETS[S.sheet];
  if(S.tab>=sh.tabs.length)S.tab=0;
  /* the rep sheet shows one seller but must not overwrite the shared filter */
  if(S.rep!=="all"&&!repList().some(r=>r.id===S.rep))S.rep="all";
  if(!CUST.some(c=>c.co===coK()&&c.id===S.cust))S.cust=(CUST.filter(c=>c.co===coK())[0]||{}).id;
  agg();drawRail();
  const co=document.getElementById("fCo");
  if(!co.options.length){Object.keys(COMPANIES).forEach(k=>{const o=document.createElement("option");
    o.value=k;o.textContent=k;co.appendChild(o);});
    co.addEventListener("change",()=>{S.co=co.value;S.ccy=COMPANIES[S.co].ccy;S.rep="all";draw();});}
  co.value=S.co;
  const cc=document.getElementById("fCcy");
  if(!cc.options.length){Object.keys(FX).forEach(k=>{const o=document.createElement("option");
    o.value=k;o.textContent=k;cc.appendChild(o);});
    cc.addEventListener("change",()=>{S.ccy=cc.value;draw();});}
  cc.value=S.ccy;
  document.getElementById("crumbs").innerHTML= sh.hidden
    ? `Sales Analytics<span>/</span>${SHEETS[S.from||0].n}<span>/</span><b>${sh.n}</b>`
    : `Sales Analytics<span>/</span>Phase 4<span>/</span><b>${sh.n}</b>`;
  document.getElementById("title").innerHTML=`Sales Analytics<i>·</i>${sh.tabs[S.tab]}`;
  document.getElementById("asof").textContent="As of "+fmtDay(G.b)+"  ·  "+
    PERIODS.find(p=>p[0]===S.period)[1]+"  ·  "+sh.scope+" scope"+
    (S.rep!=="all"?" ("+(REPS.find(r=>r.id===S.rep)||{}).n+")":"");
  const tb=document.getElementById("tabs");tb.innerHTML="";
  sh.tabs.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;
    b.setAttribute("aria-current",String(S.tab===i));
    b.addEventListener("click",()=>{S.tab=i;draw();});tb.appendChild(b);});
  const vw=document.getElementById("view");vw.innerHTML="";
  PEND.length=0;
  vw.appendChild({cso:sheetCSO,mgr:sheetMGR,acct:sheetACCT}[sh.id](S.tab));
  flushCharts();
  tip.style.opacity=0;
}
draw();
</script>
